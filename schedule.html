<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/schedule/manifest.json">
<meta name="theme-color" content="#ffffff">
<script>
  // 新バージョンを検知したら自動でページを更新（手動キャッシュ削除を不要にする）
  if ('serviceWorker' in navigator) {
    let _refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (_refreshing) return;
      _refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('/schedule/sw.js').then(function(reg) {
      // 起動のたびに更新チェック
      reg.update();
      setInterval(function(){ reg.update(); }, 60 * 60 * 1000);
    });
  }
</script>
  <title>社内スケジュール予定表</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f9f8f5;
  --border:rgba(0,0,0,0.1);--border-s:rgba(0,0,0,0.18);
  --text:#1a1a1a;--mute:#777;--hint:#aaa;
  --red:#d94040;--blue:#2563a8;--r:10px;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;}
#setup-screen{display:none!important;}
.setup-card{background:var(--surface);border-radius:14px;border:1px solid var(--border-s);padding:32px 36px;max-width:480px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.1);}
.setup-card h2{font-size:18px;font-weight:700;margin-bottom:6px;}
.setup-card p{font-size:13px;color:var(--mute);margin-bottom:20px;line-height:1.7;}
.setup-card label{display:block;font-size:12px;color:var(--mute);font-weight:500;margin-bottom:4px;}
.setup-card input{width:100%;font-size:13px;font-family:inherit;border:1px solid var(--border-s);border-radius:7px;padding:7px 10px;margin-bottom:14px;outline:none;background:var(--surface);color:var(--text);}
.setup-card input:focus{border-color:#7c3aed;}
.setup-hint{font-size:11px;color:var(--hint);margin-top:-10px;margin-bottom:14px;line-height:1.5;}
.btn-primary{width:100%;padding:9px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;background:#ede9fe;color:#4c1d95;border:1px solid #a78bfa;border-radius:8px;transition:background .15s;}
.btn-primary:hover{background:#ddd6fe;}
#status-bar{display:none;font-size:11px;padding:4px 14px;text-align:right;color:var(--hint);}
#status-bar.ok{color:#059669;}
#status-bar.err{color:var(--red);}
.board{background:var(--surface);border-radius:var(--r);border:1px solid var(--border-s);box-shadow:0 2px 16px rgba(0,0,0,0.08);overflow:hidden;}
.bh{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--surface2);border-bottom:2.5px solid var(--red);flex-wrap:wrap;}
.hd-yr{font-size:16px;font-weight:700;color:var(--red);}
.hd-mo{font-size:24px;font-weight:700;}
.hd-ttl{font-size:20px;letter-spacing:.22em;}
.hd-nav{margin-left:auto;display:flex;gap:6px;}
.btn-nav,.btn-add{font-size:12px;padding:4px 12px;cursor:pointer;background:var(--surface);border:1px solid var(--border-s);border-radius:6px;color:var(--text);font-family:inherit;transition:background .15s;white-space:nowrap;}
.btn-nav:hover,.btn-add:hover{background:#eee;}
.cal-scroll{overflow-x:auto;}
table.cal{border-collapse:collapse;table-layout:fixed;}
table.cal th,table.cal td{border:0.5px solid var(--border);vertical-align:top;padding:0;}
th.dh{text-align:center;padding:2px 1px;width:72px;min-width:72px;max-width:72px;background:var(--surface2);}
.dn{display:block;font-size:12px;font-weight:700;color:var(--text);}
.dn.su{color:var(--red);}
.dn.sa{color:var(--blue);}
.dw{display:block;font-size:9px;color:var(--mute);}
.dw.su{color:var(--red);background:#fdeaea;border-radius:2px;}
.dw.sa{color:var(--blue);background:#e6f0fb;border-radius:2px;}
td.rh{position:sticky;left:0;z-index:2;width:42px;min-width:42px;background:var(--surface2);font-size:11px;font-weight:700;text-align:center;vertical-align:middle;padding:2px 3px;color:#222;white-space:nowrap;box-shadow:2px 0 4px rgba(0,0,0,0.07);}
th.rh-top{position:sticky;left:0;z-index:3;width:42px;min-width:42px;background:var(--surface2);box-shadow:2px 0 4px rgba(0,0,0,0.07);}
td.ec{height:44px;padding:2px;vertical-align:top;cursor:pointer;transition:background .12s;position:relative;width:72px;min-width:72px;max-width:72px;overflow:hidden;}
td.ec:hover{background:#f0f0ff;}
td.ec:hover::after{content:'+';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;color:#a78bfa;opacity:0.4;pointer-events:none;}
td.ec.tc{background:#fffbe6;}
td.ec.tc:hover{background:#fff3b0;}
.ev{display:block;font-size:10px;padding:2px 4px;border-radius:3px;margin-bottom:2px;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;transition:filter .12s;}
.ev:hover{filter:brightness(.9);}
.ev-spacer{visibility:hidden;cursor:default;pointer-events:none;}
.eA{background:#ede9fe;color:#4c1d95;border-left:3px solid #7c3aed;}
.eB{background:#d1fae5;color:#064e3b;border-left:3px solid #10b981;}
.eC{background:#fce7f3;color:#831843;border-left:3px solid #ec4899;}
.eD{background:#fef3c7;color:#78350f;border-left:3px solid #f59e0b;}
.eE{background:#dcfce7;color:#14532d;border-left:3px solid #22c55e;}
.eF{background:#f1f5f9;color:#334155;border-left:3px solid #94a3b8;}
.eH{background:#fee2e2;color:#7f1d1d;border-left:3px solid #ef4444;}
.board-footer{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:0.5px solid var(--border);background:var(--surface2);flex-wrap:wrap;}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mute);}
.ld{width:12px;height:12px;border-radius:3px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--border-s);padding:20px 22px;width:360px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.18);}
.modal h3{font-size:15px;font-weight:700;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:8px;}
.mrow{margin-bottom:11px;}
.mrow label{display:block;font-size:11px;color:var(--mute);margin-bottom:3px;font-weight:500;}
.mrow input[type=text],.mrow input[type=date],.mrow select,.mrow textarea{width:100%;font-size:13px;font-family:inherit;border:1px solid var(--border-s);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s;}
.mrow input:focus,.mrow select:focus,.mrow textarea:focus{border-color:#7c3aed;}
.mrow textarea{height:52px;resize:vertical;}
.date-row{display:flex;gap:6px;align-items:center;}
.date-row input{flex:1;}
.date-row span{font-size:11px;color:var(--mute);}
.cb-group{display:flex;flex-wrap:wrap;gap:5px 10px;}
.cb-group label{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text);cursor:pointer;font-weight:400;}
.mbtns{display:flex;gap:8px;margin-top:14px;}
.mbtns button{flex:1;padding:7px;font-size:13px;border-radius:7px;cursor:pointer;font-family:inherit;border:1px solid var(--border-s);transition:background .15s;}
.btn-cancel{background:var(--surface);color:var(--text);}
.btn-cancel:hover{background:#f0f0f0;}
.btn-del{background:#fee2e2;color:#7f1d1d;border-color:#fca5a5;}
.btn-del:hover{background:#fecaca;}
.btn-save{background:#ede9fe;color:#4c1d95;border-color:#a78bfa;font-weight:700;}
.btn-save:hover{background:#ddd6fe;}
.tooltip{display:none;position:fixed;background:var(--text);color:#fff;font-size:11px;padding:5px 9px;border-radius:6px;pointer-events:none;z-index:200;max-width:200px;line-height:1.5;white-space:pre-wrap;}
#loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,0.7);z-index:300;align-items:center;justify-content:center;font-size:14px;color:var(--mute);}
#loading.show{display:flex;}
@media(max-width:600px){body{padding:6px;}.hd-ttl{display:none;}.hd-mo{font-size:18px;}.hd-yr{font-size:13px;}.bh{padding:6px 10px;}td.ec{height:44px;}td.pc{height:44px;}.board-footer{padding:5px 10px;}}

/* ===== 表示切替タブ・月間カレンダー ===== */
.view-tabs{display:flex;gap:6px;padding:8px 12px 0;background:var(--surface2);}
.vtab{font-size:12px;padding:5px 14px;cursor:pointer;background:#eee;border:1px solid var(--border-s);border-bottom:none;border-radius:8px 8px 0 0;color:var(--mute);font-family:inherit;font-weight:600;}
.vtab.active{background:var(--surface);color:#4c1d95;border-color:#a78bfa;}
table.mg{width:100%;border-collapse:collapse;table-layout:fixed;}
table.mg th{font-size:11px;font-weight:700;padding:4px 0;text-align:center;background:var(--surface2);border:0.5px solid var(--border);}
table.mg th.su{color:var(--red);background:#fdeaea;}
table.mg th.sa{color:var(--blue);background:#e6f0fb;}
table.mg td{border:0.5px solid var(--border);vertical-align:top;padding:1px;height:80px;overflow:hidden;cursor:pointer;}
table.mg td.out{background:#fafafa;cursor:default;}
table.mg td.tc{background:#fffbe6;}
.mg-dn{font-size:11px;font-weight:700;padding:1px 3px;display:block;}
.mg-dn.su{color:var(--red);}
.mg-dn.sa{color:var(--blue);}
.mev{display:block;font-size:9px;padding:1px 3px;border-radius:3px;margin-bottom:1px;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.mg-more{font-size:9px;color:#7c3aed;padding:0 3px;font-weight:700;}
.mev.mev-sp{visibility:hidden;}
.mgd-item{font-size:12px;padding:7px 9px;border-radius:6px;margin-bottom:6px;cursor:pointer;line-height:1.5;}
@media(max-width:600px){
  table.mg td{height:88px;}
  /* 各段を常に2行分の固定高さにして、空き段も予定も同じ高さ→縦位置を揃える */
  .mev{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;height:24px;}
  .mev.mev-sp{visibility:hidden;height:24px;}
}

/* ===== 連絡事項 ===== */
.notice-board{background:var(--surface);border-radius:var(--r);border:1px solid var(--border-s);box-shadow:0 2px 16px rgba(0,0,0,0.08);overflow:hidden;margin-top:12px;}
.notice-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;background:var(--surface);transition:background .15s;}
.notice-toggle:hover{background:var(--surface2);}
.notice-toggle-left{display:flex;align-items:center;gap:8px;}
.notice-toggle-title{font-size:14px;font-weight:700;color:var(--text);}
.notice-cnt{background:#bbb;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;margin-left:2px;}
.notice-cnt.unread{background:#ef4444;animation:npulse 1.2s ease-in-out infinite;}
@keyframes npulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.15);opacity:0.75;}}
.n-new{background:#ef4444;color:#fff;font-size:9px;font-weight:700;border-radius:7px;padding:1px 6px;margin-left:2px;}
.notice-arrow{font-size:13px;color:var(--hint);transition:transform .25s;}
.notice-arrow.open{transform:rotate(180deg);}
.notice-wrap{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.notice-wrap.open{max-height:1200px;}
.notice-inner{border-top:1px solid var(--border);padding:12px 14px 14px;}
.notice-list{display:flex;flex-direction:column;gap:7px;margin-bottom:10px;}
.n-item{border-radius:8px;padding:9px 32px 9px 12px;position:relative;border:1px solid transparent;}
.n-item.important{border-left:4px solid #ef4444;background:#fff5f5;border-color:#fecaca;}
.n-item.info{border-left:4px solid #3b82f6;background:#eff6ff;border-color:#bfdbfe;}
.n-item.done{border-left:4px solid #10b981;background:#f0fdf4;border-color:#bbf7d0;opacity:0.72;}
.n-meta{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap;}
.n-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px;}
.n-tag.important{background:#fee2e2;color:#dc2626;}
.n-tag.info{background:#dbeafe;color:#1d4ed8;}
.n-tag.done{background:#d1fae5;color:#065f46;}
.n-author{font-size:11px;color:#555;font-weight:500;}
.n-date{font-size:11px;color:#bbb;margin-left:auto;}
.n-body{font-size:12px;color:var(--text);line-height:1.65;white-space:pre-wrap;word-break:break-all;}
.n-actions{position:absolute;top:6px;right:8px;display:flex;gap:4px;align-items:center;}
.n-del{font-size:15px;color:#ccc;cursor:pointer;background:none;border:none;line-height:1;padding:2px;}
.n-del:hover{color:#ef4444;}
.n-edit{font-size:13px;cursor:pointer;background:none;border:none;line-height:1;padding:2px;opacity:0.5;}
.n-edit:hover{opacity:1;}
.btn-add-n{width:100%;padding:8px;font-size:12px;background:#f3f0ff;color:#5b21b6;border:1.5px dashed #a78bfa;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:600;transition:background .15s;}
.btn-add-n:hover{background:#ede9fe;}
.n-form{background:var(--surface2);border:1px solid var(--border-s);border-radius:8px;padding:11px;margin-top:9px;display:none;}
.n-form-row{display:flex;gap:7px;margin-bottom:8px;}
.n-form-row select,.n-form-row input{font-size:12px;font-family:inherit;border:1px solid var(--border-s);border-radius:6px;padding:5px 8px;background:var(--surface);color:var(--text);outline:none;}
.n-form-row select:focus,.n-form-row input:focus{border-color:#7c3aed;}
.n-form-row select{min-width:76px;}
.n-form-row input{flex:1;}
.n-ta{width:100%;font-size:12px;font-family:inherit;border:1px solid var(--border-s);border-radius:6px;padding:7px;height:64px;resize:vertical;outline:none;background:var(--surface);color:var(--text);margin-bottom:8px;}
.n-ta:focus{border-color:#7c3aed;}
.n-form-btns{display:flex;justify-content:flex-end;gap:7px;}
.n-btn-cancel{font-size:12px;padding:5px 13px;background:var(--surface);border:1px solid var(--border-s);border-radius:6px;cursor:pointer;font-family:inherit;}
.n-btn-post{font-size:12px;padding:5px 13px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:700;}
.n-btn-post:hover{background:#6d28d9;}
.n-empty{text-align:center;color:var(--hint);font-size:12px;padding:12px 0;}

/* ========== 写真行 追加スタイル ========== */
td.pc{height:54px;padding:3px;vertical-align:middle;background:#f9fbe7;cursor:pointer;position:relative;width:72px;min-width:72px;max-width:72px;overflow:hidden;}
td.pc:hover{background:#f0f4e0;}
td.pc.tc{background:#fffde0;}
td.pc:hover::after{content:'📷';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;opacity:0.25;pointer-events:none;}
td.rh.photo-rh{background:#e8f5e9;color:#2e7d32;font-size:10px;line-height:1.4;}
.ph-thumbs{display:flex;gap:2px;align-items:center;flex-wrap:nowrap;overflow:hidden;}
.ph-thumb{width:40px;height:44px;object-fit:cover;border-radius:4px;border:1.5px solid #c8e6c9;cursor:pointer;transition:transform .15s,box-shadow .15s;flex-shrink:0;}
.ph-thumb:hover{transform:scale(1.1);box-shadow:0 2px 8px rgba(0,0,0,.25);}
.ph-more{display:inline-flex;align-items:center;justify-content:center;width:22px;height:44px;background:#b2dfdb;border-radius:4px;font-size:10px;font-weight:700;color:#004d40;cursor:pointer;flex-shrink:0;}
.ph-more:hover{background:#80cbc4;}
.ph-add{display:inline-flex;align-items:center;justify-content:center;width:22px;height:44px;background:transparent;border:1.5px dashed #aaa;border-radius:4px;font-size:14px;color:#aaa;cursor:pointer;flex-shrink:0;transition:all .15s;}
.ph-add:hover{border-color:#66bb6a;color:#66bb6a;background:#f1f8e9;}
td.pc:not(:has(.ph-thumbs .ph-thumb)){cursor:pointer;}
/* 写真ライトボックス */
#photo-lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;align-items:center;justify-content:center;flex-direction:column;gap:10px;}
#photo-lb.open{display:flex;}
#photo-lb .plb-img{max-width:92vw;max-height:76vh;border-radius:10px;box-shadow:0 6px 30px rgba(0,0,0,.6);touch-action:none;transform-origin:center center;will-change:transform;}
#photo-lb .plb-cap{color:#fff;font-size:13px;text-align:center;}
#photo-lb .plb-close{position:fixed;top:14px;right:18px;color:#fff;font-size:32px;cursor:pointer;line-height:1;z-index:501;}
#photo-lb .plb-del{background:#ef4444;color:#fff;border:none;border-radius:6px;padding:5px 16px;font-size:12px;cursor:pointer;font-family:inherit;}
#photo-lb .plb-del:hover{background:#dc2626;}
#photo-lb .plb-nav{display:flex;gap:10px;align-items:center;}
#photo-lb .plb-arr{color:#fff;font-size:40px;cursor:pointer;padding:0 8px;user-select:none;}
#photo-lb .plb-arr:hover{color:#ccc;}
/* アップロード中 */
.uploading-badge{position:fixed;bottom:20px;right:20px;background:#22c55e;color:#fff;border-radius:20px;padding:6px 16px;font-size:12px;z-index:600;display:none;}
.uploading-badge.show{display:block;}
</style>
</head>
<body>

<div id="setup-screen">
  <div class="setup-card">
    <h2>🔧 初回設定（Firebase接続）</h2>
    <p>Firebaseコンソールで取得した接続情報を入力してください。<br>一度設定するとこのブラウザに保存され、次回から自動接続されます。</p>
    <label>API Key</label>
    <input type="text" id="cfg-apikey" placeholder="AIzaSy...">
    <label>Auth Domain</label>
    <input type="text" id="cfg-authdomain" placeholder="your-app.firebaseapp.com">
    <label>Project ID</label>
    <input type="text" id="cfg-projectid" placeholder="your-app-id">
    <label>App ID</label>
    <input type="text" id="cfg-appid" placeholder="1:123456789:web:abcdef...">
    <p class="setup-hint">※ Firebase Console → プロジェクトの設定 → マイアプリ → 構成 から確認できます。<br>詳しい手順は同梱の README.txt をご参照ください。</p>
    <button class="btn-primary" onclick="saveConfig()">接続して開始 →</button>
  </div>
</div>

<div id="main-screen" style="display:none;">
  <div id="status-bar">接続中...</div>
  <div class="board">
    <div class="bh">
      <span class="hd-yr" id="disp-year"></span>
      <span class="hd-mo" id="disp-month"></span>
      <span class="hd-ttl">予　定　表</span>
      <div class="hd-nav">
        <button class="btn-nav" onclick="changeMonth(-1)">&#8249; 前月</button>
        <button class="btn-nav" style="background:#ede9fe;border-color:#a78bfa;color:#4c1d95;font-weight:700;" onclick="goToday()">今日</button>
        <button class="btn-nav" onclick="changeMonth(1)">次月 &#8250;</button>
      </div>
    </div>
    <div class="view-tabs">
      <button class="vtab active" id="vtab-row" onclick="setView('row')">担当別</button>
      <button class="vtab" id="vtab-month" onclick="setView('month')">月間カレンダー</button>
    </div>
    <div class="cal-scroll" id="cal-wrap-row">
      <table class="cal" id="cal-table">
        <tr><td style="padding:24px;color:var(--mute);font-size:13px;">読込中...</td></tr>
      </table>
    </div>
    <div id="mg-wrap" style="display:none;">
      <table class="mg" id="mg-table"></table>
    </div>
    <div class="board-footer">
      <div class="legend" id="legend"></div>
      <div style="margin-left:auto;display:flex;gap:6px;">
        <button class="btn-nav" style="font-size:11px;" onclick="backupNow()">💾 バックアップ</button>
        <button class="btn-nav" style="font-size:11px;color:var(--hint);" onclick="resetConfig()">⚙ 設定変更</button>
      </div>
    </div>
  </div>
</div>

<!-- 月間カレンダー：日別詳細 -->
<div class="modal-overlay" id="mg-day-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <h3 id="mg-day-title"></h3>
    <div id="mg-day-list"></div>
    <div class="mbtns">
      <button class="btn-cancel" onclick="document.getElementById('mg-day-modal').classList.remove('open')">閉じる</button>
      <button class="btn-save" id="mg-day-add">＋ 予定を追加</button>
    </div>
  </div>
</div>

<!-- 連絡事項 -->
<div class="notice-board" id="notice-board" style="display:none;">

};

function resetConfig(){
  if(!confirm('データを再読み込みしますか？'))return;
  if(unsub)unsub();
  if(unsubPhotos)unsubPhotos();
  location.reload();
}

function initFirebase(cfg){
  try{
    if(firebase.apps.length===0){
      firebase.initializeApp(cfg);
    }
    db=firebase.firestore();
    // オフラインキャッシュ有効化（2回目以降の起動を高速化）
    try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(e){}
    document.getElementById('setup-screen').style.display='none';
    document.getElementById('main-screen').style.display='block';
    document.getElementById('status-bar').style.display='block';
    setStatus('接続中...','');
    startListener();
  }catch(e){
    alert('Firebase接続に失敗しました。\n'+e.message);
  }
}

function startListener(){
  if(unsub)unsub();
  setStatus('読込中...','');
  // 予定リスナー（先に表示してすぐ使えるようにする）
  unsub=db.collection('schedule_events').onSnapshot(snap=>{
    events={};
    snap.forEach(doc=>{events[doc.id]={...doc.data(),id:doc.id};});
    renderCalendar();
    setStatus('● リアルタイム同期中','ok');
  },err=>{setStatus('⚠ 接続エラー: '+err.message,'err');});
  // 写真は表示中の月だけ読み込む（高速化）
  startPhotoListener();
  // 連絡事項は予定表示後に読み込み
  setTimeout(startNoticeListener,300);
}

function startPhotoListener(){
  if(unsubPhotos)unsubPhotos();
  const mStart=toDS(curYear,curMonth,1);
  const mEnd=toDS(curYear,curMonth,getDays(curYear,curMonth));
  unsubPhotos=db.collection('photos')
    .where('dateKey','>=',mStart)
    .where('dateKey','<=',mEnd)
    .onSnapshot(snap=>{
      photos={};
      snap.forEach(doc=>{photos[doc.id]={...doc.data(),id:doc.id};});
      renderCalendar();
    },()=>{});
}

function setStatus(msg,cls){const el=document.getElementById('status-bar');el.textContent=msg;el.className=cls;}

function getDays(y,m){return new Date(y,m,0).getDate();}
function getDow(y,m,d){return new Date(y,m-1,d).getDay();}
function pad(n){return String(n).padStart(2,'0');}
function toDS(y,m,d){return `${y}-${pad(m)}-${pad(d)}`;}
function todayStr(){const t=new Date();return toDS(t.getFullYear(),t.getMonth()+1,t.getDate());}
// イベント名の正規化（同名判定用）：括弧書き除去・空白除去・小文字化・全角英数→半角
// さらに末尾の作業名（設営・撤去・積込など）も除去して「林業祭設営」「林業祭撤去」を同一視する
function normTitle(t){
  const base=String(t||'')
    .replace(/[（(].*?[）)]/g,'')        // （積込）(積込) などを除去
    .replace(/[\s　]/g,'')               // 空白（半角・全角）除去
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)) // 全角英数→半角
    .toLowerCase();
  const stripped=base.replace(/([・、,，\/／\-－~〜]*(設営|撤去|積込み?|積み込み|搬入|搬出|回収|片付け?|現調|本番)[・、,，\/／\-－~〜]*)+$/,'');
  return stripped||base; // 「回収」だけ等、全部消えたら元のまま
}

// タイトルごとの固定レーン（段）割り当て：同名（正規化）は同じ段、
// 日が重ならない別名はレーン共有して空段を減らす（区間彩色）
function computeLanes(rowEvents){
  const firstDate={},daySet={};
  rowEvents.forEach(e=>{
    const k=normTitle(e.title);
    if(!firstDate[k]||e.dateS<firstDate[k])firstDate[k]=e.dateS;
    if(!daySet[k])daySet[k]=new Set();
    const s=new Date(e.dateS+'T00:00'),en=new Date((e.dateE||e.dateS)+'T00:00');
    for(let dt=new Date(s);dt<=en;dt.setDate(dt.getDate()+1))daySet[k].add(dt.toISOString().slice(0,10));
  });
  const keys=[...new Set(rowEvents.map(e=>normTitle(e.title)))];
  keys.sort((a,b)=>firstDate[a]<firstDate[b]?-1:firstDate[a]>firstDate[b]?1:(a<b?-1:1));
  const laneOf={},laneDays=[];
  keys.forEach(k=>{
    let lane=0;
    while(laneDays[lane]&&[...daySet[k]].some(d=>laneDays[lane].has(d)))lane++;
    laneOf[k]=lane;
    if(!laneDays[lane])laneDays[lane]=new Set();
    daySet[k].forEach(d=>laneDays[lane].add(d));
  });
  return laneOf;
}

function renderCalendar(){
  const days=getDays(curYear,curMonth);
  document.getElementById('disp-year').textContent=curYear;
  document.getElementById('disp-month').textContent=curMonth+'月';
  if(viewMode==='month'){renderMonthGrid();updateLegend();return;}
  const today=todayStr();
  const evArr=Object.values(events);
  const phArr=Object.values(photos).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));

  let html='<thead><tr><th class="rh-top"></th>';
  for(let d=1;d<=days;d++){
    const dow=getDow(curYear,curMonth,d);
    const sc=dow===0?'su':dow===6?'sa':'';
    const ds=toDS(curYear,curMonth,d);
    const tb=ds===today?' style="background:#fffde0"':'';
    const isHoliday=!!HOLIDAYS[ds];
    const sc2=sc||(isHoliday?'su':'');
    html+=`<th class="dh"${tb}><span class="dn ${sc2}">${d}</span><span class="dw ${sc2}">${DJP[dow]}</span></th>`;
  }
  html+='</tr></thead><tbody>';

  // 予定行
  const mStart=toDS(curYear,curMonth,1);
  const mEnd=toDS(curYear,curMonth,days);
  for(const row of ROWS){
    // この担当者の当月イベントを集め、タイトルごとに固定レーン（段）を割り当てる
    const rowEvents=evArr.filter(e=>e.person===row&&e.dateS<=mEnd&&(e.dateE||e.dateS)>=mStart);
    const laneOf=computeLanes(rowEvents);

    html+=`<tr><td class="rh">${row}</td>`;
    for(let d=1;d<=days;d++){
      const ds=toDS(curYear,curMonth,d);
      const tc=ds===today?' tc':'';
      const matched=evArr.filter(e=>e.person===row&&e.dateS<=ds&&(e.dateE||e.dateS)>=ds);
      html+=`<td class="ec${tc}" onclick="openModalCell('${row}','${ds}')">`;
      // レーンごとにスロットへ配置（同名は同じ段になる）
      const slots=[];
      matched.forEach(ev=>{const ln=laneOf[normTitle(ev.title)];if(slots[ln])slots.push(ev);else slots[ln]=ev;});
      let lastLane=-1;
      slots.forEach((ev,i)=>{if(ev)lastLane=i;});
      // 行ごとの最低段数を確保（吉成・穐元・真壁=5段、敏美・縫製・その他・休み=2段）
      const minLast=(MIN_LANES[row]||1)-1;
      if(lastLane<minLast)lastLane=minLast;
      for(let i=0;i<=lastLane;i++){
        const ev=slots[i];
        if(!ev){
          html+=`<span class="ev ev-spacer">&nbsp;</span>`;
          continue;
        }
        const cls=RCLASS[row]||'eF';
        const comp=ev.companions&&ev.companions.length?'同行: '+ev.companions.join('・'):'';
        const tipTxt=[ev.title,ev.memo,comp].filter(Boolean).join('\n');
        html+=`<span class="ev ${cls}" onclick="event.stopPropagation();editEvent('${ev.id}')" onmouseenter="showTip(event,'${encodeURIComponent(tipTxt)}')" onmouseleave="hideTip()">${ev.title}${ev.memo?' '+ev.memo:''}</span>`;
      }
      html+='</td>';
    }
    html+='</tr>';
  }

  // ★ 写真行（休みの下に追加）
  html+=`<tr><td class="rh photo-rh">📷<br>写真</td>`;
  for(let d=1;d<=days;d++){
    const ds=toDS(curYear,curMonth,d);
    const tc=ds===today?' tc':'';
    const dayPhotos=phArr.filter(p=>p.dateKey===ds);
    html+=`<td class="pc${tc}" onclick="pickPhotoForDate('${ds}')">`;
    if(dayPhotos.length>0){
      // 96px幅に収まる構成：サムネ1枚＋残り枚数＋追加ボタン
      html+=`<div class="ph-thumbs">`;
      const p=dayPhotos[0];
      const safeUrl=p.url?p.url.replace(/'/g,"\\'"):'';
      const safeName=(p.name||'').replace(/'/g,"\\'");
      html+=`<img class="ph-thumb" src="${safeUrl}" onclick="event.stopPropagation();openLB('${p.id}','${ds}')" title="${safeName}">`;
      if(dayPhotos.length>1){
        html+=`<span class="ph-more" onclick="event.stopPropagation();openLB('${dayPhotos[1].id}','${ds}')">+${dayPhotos.length-1}</span>`;
      }
      html+=`<span class="ph-add" onclick="event.stopPropagation();pickPhotoForDate('${ds}')" title="写真を追加">＋</span>`;
      html+=`</div>`;
    }
    html+='</td>';
  }
  html+='</tr>';

  html+='</tbody>';
  const calTable=document.getElementById('cal-table');
  calTable.innerHTML=html;
  calTable.style.width=(42+days*72)+'px';
  updateLegend();

  requestAnimationFrame(()=>{
    const todayTh=document.querySelector('#cal-table th.dh[style*="background:#fffde0"]');
    if(todayTh){
      const scroll=document.querySelector('.cal-scroll');
      const center=todayTh.offsetLeft-(scroll.clientWidth/2)+(todayTh.offsetWidth/2);
      scroll.scrollLeft=Math.max(0,center);
    }
  });
}

function updateLegend(){
  document.getElementById('legend').innerHTML=ROWS.map(r=>{
    const c=RCOLORS[r];
    return `<div class="li"><div class="ld" style="background:${c.bg};border:1.5px solid ${c.bd}"></div>${r}</div>`;
  }).join('')+`<div class="li"><div class="ld" style="background:#e8f5e9;border:1.5px solid #22c55e"></div>📷写真</div>`;
}

// ---- 月間カレンダー（週ごとの格子）描画 ----
function renderMonthGrid(){
  const days=getDays(curYear,curMonth);
  const today=todayStr();
  const evArr=Object.values(events);
  const phArr=Object.values(photos);
  const startDow=(getDow(curYear,curMonth,1)+6)%7; // 月曜始まり
  // 月全体でレーン（段）を計算：同じイベントはどの日でも同じ段に表示される
  const mStart=toDS(curYear,curMonth,1);
  const mEnd=toDS(curYear,curMonth,days);
  const monthEvents=evArr.filter(e=>e.dateS<=mEnd&&(e.dateE||e.dateS)>=mStart);
  const laneOf=computeLanes(monthEvents);
  let html='<thead><tr>';
  ['月','火','水','木','金','土','日'].forEach((w,i)=>{html+=`<th class="${i===6?'su':i===5?'sa':''}">${w}</th>`;});
  html+='</tr></thead><tbody>';
  let d=1-startDow;
  while(d<=days){
    html+='<tr>';
    for(let i=0;i<7;i++,d++){
      if(d<1||d>days){html+='<td class="out"></td>';continue;}
      const ds=toDS(curYear,curMonth,d);
      const tc=ds===today?' tc':'';
      const hol=!!HOLIDAYS[ds];
      const dc=(i===6||hol)?'su':i===5?'sa':'';
      // 段（レーン）にスロット配置：同じイベントは毎日同じ段、空段はスペーサーで維持
      const dayEvsAll=evArr.filter(e=>e.dateS<=ds&&(e.dateE||e.dateS)>=ds);
      const slots=[];
      dayEvsAll.forEach(ev=>{const ln=laneOf[normTitle(ev.title)];if(slots[ln])slots.push(ev);else slots[ln]=ev;});
      let lastLane=-1;
      slots.forEach((ev,i)=>{if(ev)lastLane=i;});
      const dayPhotos=phArr.filter(p=>p.dateKey===ds);
      html+=`<td class="${tc}" onclick="mgOpenDay('${ds}')">`;
      html+=`<span class="mg-dn ${dc}">${d}${dayPhotos.length?' 📷':''}</span>`;
      for(let s=0;s<=lastLane;s++){
        const ev=slots[s];
        if(!ev){html+=`<span class="mev mev-sp">&nbsp;</span>`;continue;}
        const cls=RCLASS[ev.person]||'eF';
        html+=`<span class="mev ${cls}">${ev.title}</span>`;
      }
      html+='</td>';
    }
    html+='</tr>';
  }
  html+='</tbody>';
  document.getElementById('mg-table').innerHTML=html;
}

// 月間カレンダー：日をタップ → その日の予定一覧
function mgOpenDay(ds){
  const evArr=Object.values(events);
  const phArr=Object.values(photos).filter(p=>p.dateKey===ds).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  const [y,m,dd]=ds.split('-').map(Number);
  document.getElementById('mg-day-title').textContent=`${m}月${dd}日（${DJP[getDow(y,m,dd)]}）の予定`;
  let html='';
  const mS=toDS(curYear,curMonth,1),mE=toDS(curYear,curMonth,getDays(curYear,curMonth));
  const laneOf=computeLanes(evArr.filter(e=>e.dateS<=mE&&(e.dateE||e.dateS)>=mS));
  const evs=evArr.filter(e=>e.dateS<=ds&&(e.dateE||e.dateS)>=ds);
  evs.sort((a,b)=>(laneOf[normTitle(a.title)]||0)-(laneOf[normTitle(b.title)]||0));
  evs.forEach(ev=>{
    const cls=RCLASS[ev.person]||'eF';
    html+=`<div class="mgd-item ${cls}" onclick="document.getElementById('mg-day-modal').classList.remove('open');editEvent('${ev.id}')"><b>${ev.person}</b>：${ev.title}${ev.memo?'　'+ev.memo:''}</div>`;
  });
  if(phArr.length){
    html+=`<div class="mgd-item" style="background:#e8f5e9;border-left:3px solid #22c55e;" onclick="document.getElementById('mg-day-modal').classList.remove('open');openLB('${phArr[0].id}','${ds}')">📷 写真 ${phArr.length}枚を見る</div>`;
  }
  if(!html)html='<div style="font-size:12px;color:var(--mute);padding:8px 0;">予定はありません</div>';
  document.getElementById('mg-day-list').innerHTML=html;
  document.getElementById('mg-day-add').onclick=function(){
    document.getElementById('mg-day-modal').classList.remove('open');

}

let pendingDate='';

function pickPhotoForDate(ds){
  pendingDate=ds;

  input.value='';
  input.click();

async function handlePhotoFiles(input){
  const files=Array.from(input.files).filter(f=>f.type.startsWith('image/'));
  if(!files.length||!pendingDate)return;
  const badge=document.getElementById('uploading-badge');
  badge.classList.add('show');
  try{
    for(const file of files){
      const url=await compressImage(file);
      await db.collection('photos').add({
        url,
        name:file.name,
        dateKey:pendingDate,
        timestamp:Date.now(),
      });
    }
  }catch(e){alert('写真の保存に失敗しました: '+e.message);}
  badge.classList.remove('show');
}

function compressImage(file,maxW=800,q=0.60){
  return new Promise((res,rej)=>{
    const img=new Image();
    const ou=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(ou);
      const c=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=rej;
    img.src=ou;
  });
}

function openLB(photoId,ds){
  const phArr=Object.values(photos)
    .filter(p=>p.dateKey===ds)
    .sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  lbPhotos=phArr;
  lbIdx=phArr.findIndex(p=>p.id===photoId);
  if(lbIdx<0)lbIdx=0;
  if(window.lbResetZoom)window.lbResetZoom();

  document.getElementById('photo-lb').classList.add('open');
}

function showLBPhoto(){
  const p=lbPhotos[lbIdx];
  if(!p)return;
  document.getElementById('plb-img').src=p.url||'';
  // キャプション
  const capEl=document.getElementById('plb-cap');
  capEl.textContent=(p.name||'')+(lbPhotos.length>1?'　'+( lbIdx+1)+' / '+lbPhotos.length:'');
  // ドットインジケーター
  let dotEl=document.getElementById('plb-dots');
  if(!dotEl){
    dotEl=document.createElement('div');
    dotEl.id='plb-dots';
    dotEl.style.cssText='display:flex;gap:6px;justify-content:center;margin-top:4px;';
    capEl.after(dotEl);
  }
  if(lbPhotos.length>1){
    dotEl.innerHTML=lbPhotos.map((_,i)=>
      `<span style="width:8px;height:8px;border-radius:50%;background:${i===lbIdx?'#fff':'rgba(255,255,255,0.35)'};display:inline-block;transition:background .2s;"></span>`
    ).join('');
    dotEl.style.display='flex';
  }else{
    dotEl.style.display='none';
  }
  document.getElementById('plb-prev').style.visibility=lbIdx>0?'visible':'hidden';
  document.getElementById('plb-next').style.visibility=lbIdx<lbPhotos.length-1?'visible':'hidden';
}

function lbNav(dir){
  lbIdx+=dir;
  if(lbIdx<0)lbIdx=0;
  if(lbIdx>=lbPhotos.length)lbIdx=lbPhotos.length-1;
  if(window.lbResetZoom)window.lbResetZoom();
  showLBPhoto();
}

function closeLB(){
  if(window.lbResetZoom)window.lbResetZoom();
  document.getElementById('photo-lb').classList.remove('open');
}

async function deleteCurrentPhoto(){
  const p=lbPhotos[lbIdx];
  if(!p)return;
  if(!confirm('この写真を削除しますか？'))return;
  try{
    await db.collection('photos').doc(p.id).delete();
    // 削除後：残りの写真があればそのまま表示、なければ閉じる
    lbPhotos.splice(lbIdx,1);
    if(lbPhotos.length===0){
      closeLB();
    }else{
      if(lbIdx>=lbPhotos.length)lbIdx=lbPhotos.length-1;
      showLBPhoto();
    }
  }catch(e){alert('削除に失敗しました: '+e.message);}
}

document.getElementById('photo-lb').addEventListener('click',function(e){
  if(e.target===this)closeLB();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeLB();
  if(document.getElementById('photo-lb').classList.contains('open')){
    if(e.key==='ArrowLeft')lbNav(-1);
    if(e.key==='ArrowRight')lbNav(1);
  }
});

// ---- タッチ操作（ピンチズーム・ダブルタップ・スワイプ）----
(function(){
  const lb=document.getElementById('photo-lb');
  const img=document.getElementById('plb-img');
  let scale=1,tx=0,ty=0;          // 現在の拡大率・移動量
  let startX=0,startY=0;          // 1本指：開始位置
  let startDist=0,startScale=1;   // 2本指：開始時の指間距離・拡大率
  let panX=0,panY=0,moving=false; // パン用
  let lastTap=0;                  // ダブルタップ判定

  function apply(){
    img.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
  }
  function reset(){
    scale=1;tx=0;ty=0;apply();
    img.style.transition='transform .2s';
    setTimeout(()=>img.style.transition='',200);
  }
  // 写真切替時はズームを必ずリセット
  window.lbResetZoom=reset;

  function dist(t){
    const dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
    return Math.hypot(dx,dy);
  }

  img.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      // ピンチ開始
      startDist=dist(e.touches);
      startScale=scale;
      moving=false;
    }else if(e.touches.length===1){
      const now=Date.now();
      if(now-lastTap<300){
        // ダブルタップ → ズームトグル
        e.preventDefault();
        if(scale>1){reset();}
        else{scale=2.5;img.style.transition='transform .2s';apply();setTimeout(()=>img.style.transition='',200);}
        lastTap=0;
        return;
      }
      lastTap=now;
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      panX=tx;panY=ty;
      moving=scale>1; // 拡大中のみパン
    }
  },{passive:false});

  img.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      // ピンチズーム
      e.preventDefault();
      const d=dist(e.touches);
      scale=Math.min(5,Math.max(1,startScale*(d/startDist)));
      apply();
    }else if(e.touches.length===1&&moving&&scale>1){
      // 拡大中のパン
      e.preventDefault();
      tx=panX+(e.touches[0].clientX-startX);
      ty=panY+(e.touches[0].clientY-startY);
      apply();
    }
  },{passive:false});

  // スワイプで写真切替（拡大していない時のみ）
  lb.addEventListener('touchstart',e=>{
    if(scale>1)return;
    if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY;}
  },{passive:true});
  lb.addEventListener('touchend',e=>{
    if(scale>1)return; // 拡大中はスワイプ切替しない
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){
      if(dx<0)lbNav(1);else lbNav(-1);
    }
  },{passive:true});

  // PCマウスホイールでズーム
  img.addEventListener('wheel',e=>{
    e.preventDefault();
    scale=Math.min(5,Math.max(1,scale-e.deltaY*0.002));
    if(scale===1){tx=0;ty=0;}
    apply();
  },{passive:false});
})();

async function saveEvent(){

  const dateS=document.getElementById('f-date-s').value;
  const dateE=document.getElementById('f-date-e').value||dateS;

    else{await db.collection('schedule_events').add(data);}

  }catch(e){alert('保存に失敗しました: '+e.message);}

// ---- 連絡事項 ----
let noticeOpen=false, unsubNotices=null, editingNoticeId=null, latestNoticeCount=0;
const NOTICE_READ_KEY='notice_last_read_v1';

function toggleNotice(){
  noticeOpen=!noticeOpen;
  document.getElementById('notice-wrap').classList.toggle('open',noticeOpen);
  document.getElementById('notice-arrow').classList.toggle('open',noticeOpen);
  if(noticeOpen){
    // 開いたら既読扱い（バッジをグレーの件数表示に戻す）
    localStorage.setItem(NOTICE_READ_KEY,String(Date.now()));
    const cnt=document.getElementById('notice-cnt');
    cnt.classList.remove('unread');
    cnt.textContent=latestNoticeCount;
    if(latestNoticeCount===0)cnt.style.display='none';
  }
}

function toggleNForm(){
  const f=document.getElementById('n-form');

    document.getElementById('n-author').value='';

function openEditNotice(id,tag,author,body){

async function postNotice(){
  const tag=document.getElementById('n-tag').value;
  const author=document.getElementById('n-author').value.trim()||'名無し';
  const body=document.getElementById('n-body').value.trim();
  if(!body){alert('内容を入力してください');return;}
  try{
    if(editingNoticeId){
      // 編集モード：既存ドキュメントを更新
      await db.collection('notices').doc(editingNoticeId).update({tag,author,body});
      editingNoticeId=null;
    }else{
      // 新規投稿
      await db.collection('notices').add({tag,author,body,timestamp:Date.now()});
    }
    document.getElementById('n-body').value='';
    document.getElementById('n-form').style.display='none';
    document.getElementById('n-btn-post').textContent='投稿する';
  }catch(e){alert('保存に失敗しました: '+e.message);}
}

async function deleteNotice(id){
  if(!confirm('この連絡事項を削除しますか？'))return;
  try{await db.collection('notices').doc(id).delete();}
  catch(e){alert('削除に失敗しました: '+e.message);}
}

function startNoticeListener(){
  if(unsubNotices)unsubNotices();
  unsubNotices=db.collection('notices').onSnapshot(snap=>{
    const notices=[];
    snap.forEach(doc=>notices.push({...doc.data(),id:doc.id}));
    notices.sort((a,b)=>b.timestamp-a.timestamp);
    renderNotices(notices);
  },()=>{});
}

function renderNotices(notices){
  const board=document.getElementById('notice-board');
  board.style.display='block';
  const list=document.getElementById('notice-list');
  const cnt=document.getElementById('notice-cnt');
  if(notices.length===0){
    list.innerHTML='<div class="n-empty">連絡事項はまだありません</div>';
    cnt.style.display='none';
    return;
  }
  latestNoticeCount=notices.length;
  // 未読判定
  const lastRead=Number(localStorage.getItem(NOTICE_READ_KEY)||0);
  const unread=notices.filter(n=>(n.timestamp||0)>lastRead).length;
  if(unread>0&&!noticeOpen){
    cnt.textContent='未読'+unread;
    cnt.classList.add('unread');
  }else{
    cnt.textContent=notices.length;
    cnt.classList.remove('unread');
  }
  cnt.style.display='inline';
  const tagMap={important:'重要',info:'連絡',done:'済み'};
  list.innerHTML=notices.map(n=>{
    const d=new Date(n.timestamp);
    const ds=(d.getMonth()+1)+'/'+(d.getDate());
    const isNew=(n.timestamp||0)>lastRead;
    const bodyEsc=(n.body||'').replace(/</g,'&lt;').replace(/\n/g,'<br>');
    const bodyRaw=(n.body||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
    return `<div class="n-item ${n.tag||'info'}">
      <div class="n-actions">
        <button class="n-edit" onclick="openEditNotice('${n.id}','${n.tag||'info'}','${(n.author||'').replace(/'/g,"\\'")}','${bodyRaw}')">✏️</button>
        <button class="n-del" onclick="deleteNotice('${n.id}')">×</button>
      </div>
      <div class="n-meta">
        <span class="n-tag ${n.tag||'info'}">${tagMap[n.tag]||'連絡'}</span>
        <span class="n-author">${n.author||''}</span>
        ${isNew?'<span class="n-new">NEW</span>':''}
        <span class="n-date">${ds}</span>
      </div>
      <div class="n-body">${bodyEsc}</div>
    </div>`;
  }).join('');
}

// ---- バックアップ ----
const BACKUP_KEY='schedule_last_backup_v1';

async function downloadBackup(includePhotos){
  const data={exportedAt:new Date().toISOString(),events:[],notices:[]};
  const evSnap=await db.collection('schedule_events').get();
  evSnap.forEach(d=>data.events.push({id:d.id,...d.data()}));
  const ntSnap=await db.collection('notices').get();
  ntSnap.forEach(d=>data.notices.push({id:d.id,...d.data()}));
  if(includePhotos){
    data.photos=[];
    const phSnap=await db.collection('photos').get();
    phSnap.forEach(d=>data.photos.push({id:d.id,...d.data()}));
  }
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const t=new Date();
  a.download=`schedule-backup-${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  localStorage.setItem(BACKUP_KEY,String(Date.now()));
}

function backupNow(){
  const withPhotos=confirm('写真もバックアップに含めますか？\n（写真が多いとファイルが大きくなります）\n\nOK ＝ 写真も含む\nキャンセル ＝ 予定・連絡事項のみ');
  downloadBackup(withPhotos)
    .then(()=>alert('バックアップファイルをダウンロードしました。\n大切な場所に保存してください。'))
    .catch(e=>alert('バックアップに失敗しました: '+e.message));
}

// 30日ごとの自動バックアップリマインド
setTimeout(()=>{
  const last=Number(localStorage.getItem(BACKUP_KEY)||0);
  if(last===0){
    // 初回はリマインド基準日だけ記録（いきなり全員に出さない）
    localStorage.setItem(BACKUP_KEY,String(Date.now()));
    return;
  }
  if(Date.now()-last>30*24*60*60*1000){
    if(confirm('前回のバックアップから30日以上経過しました。\nバックアップを保存しますか？（月1回推奨）')){
      backupNow();
    }else{
      // 断られたら7日後に再度
      localStorage.setItem(BACKUP_KEY,String(Date.now()-23*24*60*60*1000));
    }
  }
},3000);
